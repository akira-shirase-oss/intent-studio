name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new security advisories appear without any code change.
    - cron: "41 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: check (scripts/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w @intent-studio/workspace playwright install --with-deps chromium
      # Linux hands outgoing connections ports from 32768 to 60999, which includes the 59400–59499
      # range the stack and the drills listen on. Keep outgoing ports below it.
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      - run: scripts/check.sh
      # Its own step, not a line inside check.sh: an earlier set -e failure would skip
      # it otherwise, and the shipped binary carrying a seam is exactly what must not hide.
      # `if: !cancelled()` so it runs even when check.sh is already red (B1).
      - name: Mutation seams absent from the shipped binary
        if: ${{ !cancelled() }}
        run: scripts/check-seams.sh
      # The check must be able to go red: a feature build must fail it.
      - name: Prove the seam check refuses a mutated binary
        if: ${{ !cancelled() }}
        run: scripts/check-seams.sh --prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: workspace-playwright
          path: apps/workspace/test-results/
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose -p intent-studio -f deploy/compose.yaml logs --no-color --tail 200

  # The drills get their own job so a unit-test failure can never hide a drill's red —
  # the session decode bug (N15) shipped exactly that way. This job runs the same
  # scripts/drills.sh check.sh would, against the real stack, independently.
  drills:
    name: drills (scripts/drills.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      - run: scripts/drills.sh
      # The shipped binary is what the attacks just ran against — prove it carries no seam.
      # `if: !cancelled()` so a red drills run can never hide it (B1).
      - name: Mutation seams absent from the shipped binary
        if: ${{ !cancelled() }}
        run: scripts/check-seams.sh
      - name: Prove the seam check refuses a mutated binary
        if: ${{ !cancelled() }}
        run: scripts/check-seams.sh --prove
      - name: Stack logs
        if: failure()
        run: docker compose -p intent-studio -f deploy/compose.yaml logs --no-color --tail 200

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
