[package]
name = "intent-worker"
description = "Intent Studio's asset worker (D-011, D-062): one process per untrusted file — an SVG sanitized to an allowlist by re-serialization, a PNG or JPEG decoded under pixel and memory limits and re-encoded without metadata, a TrueType or OpenType font parsed — with resource limits on itself. The only crate that may hold a decoder; intent-server never links it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The check job's HTML parsing (I2-1); PNG and JPEG only for assets, no
# threads (one job per process, CPU-limited).
html5ever.workspace = true
image = { workspace = true }
intent-domain.workspace = true
intent-render.workspace = true
markup5ever_rcdom.workspace = true
rlimit.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
skrifa.workspace = true

# The seccomp confinement is Linux-only; on other platforms the rlimits alone stand.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5.0"

[dev-dependencies]
time.workspace = true
tokio.workspace = true

[lints]
workspace = true
