[package]
name = "intent-server"
description = "Intent Studio's Axum server. I0: lead intake (bounded, idempotent, rate-limited, committed with its outbox before it is acknowledged), the leased notifier, health, the operator inbox API and the workspace app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["multipart"] }
clap.workspace = true
fastrand.workspace = true
hashlink.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
intent-db.workspace = true
intent-domain.workspace = true
intent-egress.workspace = true
intent-notify.workspace = true
intent-render.workspace = true
intent-store.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

# PR_SET_DUMPABLE is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[[bin]]
# The hostile child the browser-confinement proofs run — exists only under the
# feature so a shipped tree never carries it.
name = "browser_probe"
path = "src/bin/browser_probe.rs"
required-features = ["mutation-seams"]

[dev-dependencies]
# Test fixtures only (an image to upload); the server itself never links a decoder (A6).
image.workspace = true
# The attacks suite's fuzz targets drive the real decoder crate, never an in-server copy.
intent-worker = { path = "../intent-worker" }
intent-provider-fixture.workspace = true
proptest = "1"
reqwest.workspace = true
sqlx.workspace = true

[features]
default = []
# Compiles the INTENT_MUTATION seams the attack suite's mutation proofs exercise.
# Development and the drill harness only — a shipped build must never carry them
# (scripts/check.sh strings-checks the release binary).
mutation-seams = ["intent-egress/mutation-seams"]

[lints]
workspace = true
