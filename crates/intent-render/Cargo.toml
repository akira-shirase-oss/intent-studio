[package]
name = "intent-render"
description = "Intent Studio's job driver for the isolated worker (D-011, D-062): runs one untrusted-input job per worker process with no environment, a deadline and bounded output, and turns every failure — a crash included — into a named refusal. Holds no decoder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

# The hostile child the browser-confinement proofs run — exists only under the
# feature so a shipped tree never carries it.
[[bin]]
name = "browser_probe"
path = "src/bin/browser_probe.rs"
required-features = ["mutation-seams"]

[features]
# Compiles the confinement proof artifacts (the probe binary; the test suite
# arms the hole flags directly). intent-server's mutation-seams feature wires
# the same name onto its own seams.
mutation-seams = []

[lints]
workspace = true
