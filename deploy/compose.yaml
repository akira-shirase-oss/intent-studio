# Intent Studio's local development and test stack: `scripts/stack.sh up`.
#
# Development only. Every port is bound to 127.0.0.1 and stays inside 59400–59499 (Postgres on
# 59432), so this stack never collides with the other projects on the maintainer's machine. The
# credentials here are public. The image is pinned by digest; to upgrade, change the tag, look up
# the digest with `docker buildx imagetools inspect postgres:<tag>`, and run scripts/check.sh.
name: intent-studio

services:
  # The only authority (invariant 1). The db-down drill stops and starts this service.
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: intent-dev
      POSTGRES_DB: intent
    # Durability stays at Postgres's defaults (fsync and synchronous_commit on): a lead is
    # acknowledged only after its commit, so the commit must mean what it says.
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:59432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=intent", "--dbname=intent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 1s

volumes:
  postgres:
