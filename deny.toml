# cargo-deny: scripts/check.sh runs `cargo deny check` when cargo-deny is installed, and CI runs
# it in its own job. Every advisory exception must carry `re-check YYYY-MM-DD` in its reason.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { crate = "openssl", reason = "one TLS stack (rustls) when TLS arrives" },
    { crate = "openssl-sys", reason = "one TLS stack (rustls) when TLS arrives" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
